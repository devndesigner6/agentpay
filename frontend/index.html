<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="description" content="Intelligent payment routing for AI agents using Algorand x402" />
    <link rel="icon" type="image/jpeg" href="/Avatar.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;

        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
      }
      :root {
        --bg-primary: #FFFFFF;
        --bg-secondary: #F8FAFC;
        --bg-tertiary: #F1F5F9;
        --card-bg: #FFFFFF;
        --border-color: #E2E8F0;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --accent-blue: #2563EB;
        --accent-gradient: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
        --success: #10B981;
        --warning: #F59E0B;
        --danger: #EF4444;
      }
      .grid-blueprint {
        background-color: #FFFFFF;
        background-image: 
          linear-gradient(to right, rgba(37, 99, 235, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(37, 99, 235, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
      }
